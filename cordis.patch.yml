# dsh-meta-theory — DSH bundle patch
#
# 把插件宿主半侧挂进当前 profile 的配置树。插件只注册工具与命令（无浏览器半侧），
# 因此 package.json 里不声明 dsh.client。
#
# 安装（不手改 profile patch）：
#   dsh plugin --profile desktop add dsh-meta-theory
# 本地开发安装：
#   dsh plugin --profile desktop add link:D:\\DeepSeek-Work\\dsh-meta-theory
- insert:
    - id: dsh-meta-theory
      name: dsh-meta-theory
